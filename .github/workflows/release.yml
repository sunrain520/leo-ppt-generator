name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/leo-ppt-generator/runtime[test]"
          python -m pip install jsonschema pytest
      - name: Run unit and property tests
        env:
          CI: "1"
        run: python -m pytest tests/unit tests/property -q

  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both distribution channels
        run: python scripts/build_release.py --output dist
      - name: Validate manifest and channel parity
        run: python scripts/validate_release.py dist/release-manifest.json
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leo-ppt-generator-${{ github.ref_name }}
          path: dist/
